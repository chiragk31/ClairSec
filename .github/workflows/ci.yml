name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Lint, Types, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Lint and formatting
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Type checking
        run: |
          mypy --strict backend/app/

      - name: Unit and non-Docker tests
        run: |
          cd backend
          pytest -m "not docker and not llm" -v

  desktop-checks:
    name: Flutter Desktop Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2" # Required: >=3.44.0 (Dart >=3.13.2)
          channel: "stable"
          cache: true

      - name: Flutter pub get
        run: |
          cd desktop
          flutter pub get

      - name: Flutter analyze
        run: |
          cd desktop
          flutter analyze

      - name: Flutter test
        run: |
          cd desktop
          flutter test
